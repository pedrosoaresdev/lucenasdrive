# Três sites estáticos (SPA). Em produção, sirva cada portal em seu próprio domínio com HTTPS
# (ex.: app., motorista. e admin.) e restrinja o admin por rede/WAF quando possível.
map $sent_http_content_type $cache_policy {
  default "no-cache";
  ~*(javascript|css|font|image) "public, max-age=31536000, immutable";
}

server {
  listen 4200;
  root /usr/share/nginx/passenger;
  include /etc/nginx/conf.d/common.inc;
}
server {
  listen 4201;
  root /usr/share/nginx/driver;
  include /etc/nginx/conf.d/common.inc;
}
server {
  listen 4202;
  root /usr/share/nginx/admin;
  include /etc/nginx/conf.d/common.inc;
}
